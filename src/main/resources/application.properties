# -----------------------------------------------------------------------------
# Money Master 2 - application.properties
# -----------------------------------------------------------------------------
# Todas as chaves sensiveis ou dependentes de ambiente ficam parametrizadas por
# variaveis de ambiente no formato ${VARIAVEL:valorPadrao}.
#
# Para desenvolvimento local, voce pode criar um arquivo .env na raiz do projeto
# usando o .env.example como base. A linha abaixo faz o Spring Boot tentar ler
# esse arquivo se ele existir. Em producao, prefira variaveis de ambiente reais.
# -----------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# -----------------------------------------------------------------------------
# Aplicacao / servidor
# -----------------------------------------------------------------------------
spring.application.name=${APP_NAME:money-master-2}
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# -----------------------------------------------------------------------------
# Banco de dados
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/money_master_2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -----------------------------------------------------------------------------
# Flyway
# -----------------------------------------------------------------------------
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# -----------------------------------------------------------------------------
# E-mail / SMTP
# -----------------------------------------------------------------------------
# =========================================================
# MAIL / SMTP
# =========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}

spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# =========================================================
# MONEY MASTER - EMAIL
# =========================================================
money-master.email.application-name=${APP_NAME:Money Master}
money-master.email.from=${MAIL_FROM:${MAIL_USERNAME:}}
money-master.email.confirmation-base-url=${EMAIL_CONFIRMATION_BASE_URL:http://localhost:8080/api/auth/confirm-email}

# -----------------------------------------------------------------------------
# Thymeleaf
# -----------------------------------------------------------------------------
spring.thymeleaf.encoding=UTF-8

# -----------------------------------------------------------------------------
# Spring AI / OpenAI
# -----------------------------------------------------------------------------
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4.1-mini}

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health,info}

# -----------------------------------------------------------------------------
# Seguranca / CORS / JWT
# -----------------------------------------------------------------------------
app.security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
app.security.cors.exposed-headers=Authorization,Location
app.security.cors.allow-credentials=true
app.security.cors.max-age-seconds=3600

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:}
app.security.jwt.issuer=${APP_SECURITY_JWT_ISSUER:money-master-2}
app.security.jwt.access-token-minutes=${APP_SECURITY_ACCESS_TOKEN_MINUTES:30}
app.security.jwt.refresh-token-days=${APP_SECURITY_REFRESH_TOKEN_DAYS:15}

# -----------------------------------------------------------------------------
# Bootstrap do administrador inicial
# -----------------------------------------------------------------------------
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Administrador}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@moneymaster.local}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}
# -----------------------------------------------------------------------------
# IA Financeira / Tool Calling
# -----------------------------------------------------------------------------
money-master.ai.finance.default-account-name=${AI_FINANCE_DEFAULT_ACCOUNT_NAME:Conta principal}
money-master.ai.finance.default-account-type=${AI_FINANCE_DEFAULT_ACCOUNT_TYPE:CHECKING}
money-master.ai.finance.locale=${AI_FINANCE_LOCALE:pt-BR}
money-master.ai.finance.zone-id=${AI_FINANCE_ZONE_ID:America/Sao_Paulo}

# -----------------------------------------------------------------------------
# Banco Central do Brasil / SGS
# -----------------------------------------------------------------------------
money-master.integrations.bcb.sgs.base-url=${BCB_SGS_BASE_URL:https://api.bcb.gov.br/dados/serie/bcdata.sgs}
money-master.integrations.bcb.sgs.cdi-series-code=${BCB_CDI_SERIES_CODE:12}
money-master.integrations.bcb.sgs.latest-values-limit=${BCB_SGS_LATEST_VALUES_LIMIT:20}

# -----------------------------------------------------------------------------
# Cofrinhos / rendimento automatico
# -----------------------------------------------------------------------------
money-master.savings-jar.yield.apply-on-startup=${SAVINGS_JAR_YIELD_APPLY_ON_STARTUP:true}
money-master.savings-jar.yield.fail-startup-on-error=${SAVINGS_JAR_YIELD_FAIL_STARTUP_ON_ERROR:false}
money-master.savings-jar.yield.zone-id=${SAVINGS_JAR_YIELD_ZONE_ID:America/Sao_Paulo}
money-master.savings-jar.yield.default-lookback-days=${SAVINGS_JAR_YIELD_DEFAULT_LOOKBACK_DAYS:10}
